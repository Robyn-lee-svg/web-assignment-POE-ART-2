        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <header>
            <div style="display:inline-block; vertical-align: middle;">
                    <img src="https://tse1.mm.bing.net/th/id/OIP.ZLMKSwrI5VjznGvvN7XSRwAAAA?rs=1&pid=ImgDetMain&o=7&rm=3" alt="logo" width="350"><br><br>

            <h1> 
                
                PLEASE FELL FREE TO CONTACT US FOR ENQUERIES!
                
            </h1><br><br>
        
        
            <nav>

                <div style="float: right; vertical-align: middle; margin-top: 20p;">

                    <a href="index.html">HOME</a>
                    <a href="about.html">ABOUT</a>

                </div>    
            </nav>

        </header>

        <main>
            <section id="ENQUERY">
                
                <form id="enquiry form">
                    <label for ="name">NAME:</label>
                    <input type="text" placeholder="Your name" required><br><br>

                    <label for ="surname">SURNAME:</label>
                    <input type="text" placeholder="YOUR SURNAME" required><br><br>

                    <label for="phone">PHONE NUMBER</label>
                    <input type="text" placeholder="YOUR PHONE NUMBER" required><br><br>

                    <label for ="email">EMAIL</label>
                    <input type="email" placeholder="YOUR EMAIL" required><br><br>
                    <select required>
                        <option value="">SELECT ENQUIRY TYPE</option>
                        <option value="Pricing">PRICING</option>
                        <option value="Custom Orders">CUSTOM ORDERS</option>
                        <option value="Availibility">AVAILIBILTY</option>
                    </select>

                    <textarea placeholder="YOUR MESSAGE" required></textarea><br><br>

                

                     <button type="submit">Send</button>


                </form>
            </section>

            <script>
                document.getElementById("enquiry form").addEventListener("SUBMIT" , function(events) {
                    e.preventDefault();
                    alert("THANK YOU! WE WILL GET BACK TO YOU AS SOON AS POSSIBLE");
                })
            </script>
        </main>
